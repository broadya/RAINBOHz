# Both partials arrive on the left (positive azimuth) fundamental, 100.0 Hz, at phase 0.
partial_state_set:
  hzl_version: "0.1.0"
  hzl_type: partial_state_set
  name: left_arrive
  namespace: state_sets
  layer: "0: base"
  partial_states:
    - partial_state: {identifier: left_a, frequency: 100.0, amplitude: -12.0, phase: 0}
    - partial_state: {identifier: left_b, frequency: 100.0, amplitude: -12.0, phase: 0}
