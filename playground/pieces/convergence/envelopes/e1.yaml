# Source s1: detuned pairs to sawtooth over 10 beats, then held 10.
envelope:
  hzl_version: "0.1.0"
  hzl_type: envelope
  name: e1
  namespace: envelopes
  layer: "0: base"
  initial_partial_state_set: {namespace: state_sets, name: s1_start}
  envelope_stages:
    - envelope_stage:
        duration: "10:0"
        envelope_transforms:
          - envelope_transform:
              transformation: {namespace: transformations, name: update}
              source_partial_state_set: {namespace: state_sets, name: s1_saw}
    - envelope_stage:
        duration: "10:0"
        envelope_transforms:
          - envelope_transform:
              transformation: {namespace: transformations, name: update}
              source_partial_state_set: {namespace: state_sets, name: s1_hold}
