# Render request for engine-db/examples/polytempo-stretch-score.cypher.
#
#   make run-rendering-engine RE_STATE=engine-db/examples/polytempo-stretch-score.cypher \
#       RE_REQUEST=rendering-engine/examples/polytempo-stretch-request.yaml
#
# The child map, stretched and compensated, places its points at 0, 1.1301,
# 2.0, 2.5500, 3.0 and 4.0 s. Frames 0 to 4 cover every point; frame 5 is
# past the end and renders as silence.

frames:
  - frame: 0
  - frame: 1
  - frame: 2
  - frame: 3
  - frame: 4
  - frame: 5
