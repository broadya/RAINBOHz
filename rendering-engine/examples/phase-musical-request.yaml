# Render request for engine-db/examples/phase-musical-score.cypher.
#
#   make run-rendering-engine RE_STATE=engine-db/examples/phase-musical-score.cypher \
#       RE_REQUEST=rendering-engine/examples/phase-musical-request.yaml
#
# The score is in musical time on tempo-map-score's tempo map, and ends at
# 6.7726 s. Frames 0 to 6 cover every phase point and the ramps between
# them; frame 7 is past the end and renders as silence.

frames:
  - frame: 0
  - frame: 1
  - frame: 2
  - frame: 3
  - frame: 4
  - frame: 5
  - frame: 6
  - frame: 7
