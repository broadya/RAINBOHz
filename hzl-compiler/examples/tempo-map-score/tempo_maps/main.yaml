# 120 BPM at beat 0, ramping linearly in musical position to 60 BPM at
# beat 4, which then holds. Beats 0..4 take 4 ln 2 = 2.7726 s; every beat
# after that takes one second.
tempo_map:
  hzl_version: "0.1.0"
  hzl_type: tempo_map
  name: main
  namespace: tempo_maps
  layer: "0: base"
  ticks_per_beat: 960
  points:
    - tempo_map_point:
        position: "0:0"
        tempo: 120.0
        hold: false
    - tempo_map_point:
        position: "4:0"
        tempo: 60.0
        hold: true
