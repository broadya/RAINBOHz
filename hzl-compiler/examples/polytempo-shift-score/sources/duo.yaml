# No trajectory: straight ahead at 1 m, from the entity's start on main.
sound_source:
  hzl_version: "0.1.0"
  hzl_type: sound_source
  name: duo
  namespace: sources
  layer: "001:Voices"
  envelopes:
    - envelope: {namespace: envelopes, name: chord}       # on main, the entity's map
    - envelope: {namespace: envelopes, name: voice}
      tempo_map: {namespace: tempo_maps, name: voice}
      position: "0:0"                                     # beat 0 of voice: 4 s
