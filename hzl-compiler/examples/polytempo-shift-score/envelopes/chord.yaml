# A at 440 Hz, fading from -6 dB to -12 dB over 4 beats.
envelope:
  hzl_version: "0.1.0"
  hzl_type: envelope
  name: chord
  namespace: envelopes
  layer: "001:Voices"
  initial_partial_state_set: {namespace: state_sets, name: chord_start}
  envelope_stages:
    - envelope_stage:
        duration: "4:0"
        envelope_transforms:
          - envelope_transform:
              transformation: {namespace: transformations, name: update}
              source_partial_state_set: {namespace: state_sets, name: chord_end}
