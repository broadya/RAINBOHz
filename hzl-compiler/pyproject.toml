[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hzl-compiler"
version = "0.1.0"
description = "Compiles HzL (Hertz Language) source to the RAINBOHz canonical model, emitted as Cypher for engine-db"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pyyaml>=6.0",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
hzlc = "hzl_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP modern syntax,
# B likely bugs, N naming.
select = ["E", "W", "F", "I", "UP", "B", "N"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses, so a shared default instance is safe (B008).
extend-immutable-calls = ["hzl_compiler.lower.score.EngineOptions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
