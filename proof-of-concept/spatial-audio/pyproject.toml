[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-poc"
version = "0.1.0"
description = "Proof of concept for RAINBOHz spatial audio: perfect coincident virtual microphones (Python oracle)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
spatial-poc-report = "spatial_poc.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
